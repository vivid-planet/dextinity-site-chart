apiVersion: v1
kind: Service
metadata:
  name: {{ include "dextinity-site.fullname" . }}
  labels:
    {{- include "dextinity-site.labels" . | nindent 4 }}
spec:
{{- if .Values.service.sessionAffinityTimeoutSeconds }}
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: {{ .Values.service.sessionAffinityTimeoutSeconds }}
{{- end }}
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
{{- if .Values.metrics.enabled }}
    - name: metrics
      protocol: TCP
      port: {{ .Values.metrics.containerPorts.http }}
      targetPort: metrics
{{- end }}
  selector:
    {{- include "dextinity-site.selectorLabels" . | nindent 4 }}
